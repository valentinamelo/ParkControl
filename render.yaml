# Blueprint de Render (https://render.com): New + > Blueprint > elegir este repositorio.
# Crea la base PostgreSQL y el servicio web con el Dockerfile.
databases:
  - name: parkcontrol-db
    databaseName: parkcontrol
    user: parkcontrol
    plan: free

services:
  - type: web
    name: parkcontrol
    runtime: docker
    plan: free
    healthCheckPath: /api/salud/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parkcontrol-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: CARGAR_DATOS_INICIALES
        value: "1"
      - key: TZ
        value: America/Bogota
