<div class="app">
  <aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-square-parking"></i>ParkControl</div>

    <nav>
      @for (item of menu(); track item.ruta) {
        <a class="enlace" [routerLink]="item.ruta" routerLinkActive="activo">
          <i class="fa-solid" [class]="item.icono"></i>{{ item.texto }}
        </a>
      }
    </nav>

    @if (auth.usuario(); as usuario) {
      <div class="usuario">
        <b>{{ usuario.nombre }}</b>
        <span>{{ usuario.rol_display }}</span>
      </div>
    }
    <button class="enlace salir" type="button" (click)="auth.logout()">
      <i class="fa-solid fa-right-from-bracket"></i>Cerrar sesión
    </button>
  </aside>

  <main>
    <router-outlet />
  </main>
</div>
