<section class="pantalla">
  <form class="card login" [formGroup]="form" (ngSubmit)="ingresar()">
    <div class="marca">
      <i class="fa-solid fa-square-parking"></i>
      <h1>ParkControl</h1>
      <p>Administración de parqueadero</p>
    </div>

    @if (error()) {
      <div class="alerta">{{ error() }}</div>
    }

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input class="input" id="email" type="email" formControlName="email" placeholder="admin@parkcontrol.com" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Escribe un correo válido.</small>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input class="input" id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">La contraseña es obligatoria.</small>
      }
    </div>

    <button class="btn btn-primario btn-bloque" type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>
</section>
