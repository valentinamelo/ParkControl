<form class="card" style="max-width: 760px" [formGroup]="form" (ngSubmit)="guardar()">
  <h2>Horario de atención</h2>
  @if (error()) {
    <div class="alerta">{{ error() }}</div>
  }
  @if (aviso()) {
    <div class="exito">{{ aviso() }}</div>
  }

  <div class="tabla-wrap">
    <table>
      <thead>
        <tr><th>Día</th><th>Abierto</th><th>Apertura</th><th>Cierre</th></tr>
      </thead>
      <tbody formArrayName="dias">
        @for (fila of dias.controls; track fila.value.id) {
          <tr [formGroupName]="$index" [class.inactivo]="!fila.value.abierto">
            <td>
              <b>{{ fila.value.dia }}</b>
              @if (erroresFila()[fila.getRawValue().id]; as mensaje) {
                <br /><small class="error">{{ mensaje }}</small>
              }
            </td>
            <td>
              <label class="check"><input type="checkbox" formControlName="abierto" />{{ fila.value.abierto ? 'Sí' : 'Cerrado' }}</label>
            </td>
            <td>
              <input class="input" type="time" formControlName="hora_apertura" [attr.aria-label]="'Apertura ' + fila.value.dia"
                     [class.invalido]="erroresFila()[fila.getRawValue().id]" />
            </td>
            <td>
              <input class="input" type="time" formControlName="hora_cierre" [attr.aria-label]="'Cierre ' + fila.value.dia"
                     [class.invalido]="erroresFila()[fila.getRawValue().id]" />
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="vacio">Cargando horario…</td></tr>
        }
      </tbody>
    </table>
  </div>

  <div class="acciones">
    <button class="btn btn-primario" type="submit" [disabled]="guardando() || dias.pristine">
      {{ guardando() ? 'Guardando…' : 'Guardar horario' }}
    </button>
  </div>
</form>
