<header class="encabezado">
  <div>
    <h1>Configuración</h1>
    <p>Tarifas, horarios, usuarios y datos del parqueadero.</p>
  </div>
  <span class="badge">Solo administrador</span>
</header>

<nav class="pestanas">
  @for (p of pestanas; track p.ruta) {
    <a [routerLink]="p.ruta" routerLinkActive="activa"><i class="fa-solid" [class]="p.icono"></i>{{ p.texto }}</a>
  }
</nav>

<router-outlet />
