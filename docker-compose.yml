# Sistema completo con PostgreSQL, como en producción:
#   docker compose up --build
# y abre http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parkcontrol
      POSTGRES_USER: parkcontrol
      POSTGRES_PASSWORD: parkcontrol
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkcontrol"]
      interval: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://parkcontrol:parkcontrol@db:5432/parkcontrol
      DJANGO_SECRET_KEY: cambia-esta-clave-en-produccion
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080
      CARGAR_DATOS_INICIALES: "1"
      TZ: America/Bogota
    ports:
      - "8080:8000"

volumes:
  datos:
